name: PowerShell validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Parse scripts and run focused tests
        shell: pwsh
        run: |
          $testShell = '${{ matrix.shell }}'
          & $testShell -NoProfile -NonInteractive -ExecutionPolicy RemoteSigned -File ./tests/Invoke-CI.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
